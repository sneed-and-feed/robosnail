name: RoboSnail CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Rust #![no_std] Arena, Pytest & GFM Math Audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test & build #![no_std] Rust SIMD C-ABI kernel
        run: |
          cargo test --release
          cargo build --release
        shell: bash

      - name: Install Python package & test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
        shell: bash

      - name: Run 21-Rule GFM & KaTeX Math Compliance Audit
        run: python scripts/audit_gfm_math.py README.md docs/ARCHITECTURE.md
        shell: bash

      - name: Static Lean 4 Formalization Gate (Zero Sorry / Admit)
        run: |
          python - << 'EOF'
          import pathlib, re, sys
          lean_path = pathlib.Path("formalization/OcclusionTriad.lean")
          text = lean_path.read_text(encoding="utf-8")
          clean = re.sub(r"/-.*?-/", "", text, flags=re.S)
          clean = re.sub(r"--[^\n]*", "", clean)
          bad = re.findall(r"\b(?:sorry|admit)\b", clean)
          decls = re.findall(r"^\s*(?:theorem|lemma|def|structure)\s+\w+", clean, flags=re.M)
          print(f"OcclusionTriad.lean: {len(text.splitlines())} lines, {len(decls)} declarations, {len(bad)} sorry/admit tokens")
          if bad or len(decls) < 60:
              sys.exit(1)
          EOF
        shell: bash

      - name: Run Cross-Platform Pytest Verification Suite
        run: pytest tests/test_robosnail.py -v
        shell: bash
